<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>30 天爆款腳本庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700;900&display=swap" rel="stylesheet" />
<style>
  /* Layout: single centered column (mobile-first) → settings card, tabbed output, checklist.
     Single deliberate light look: warm ivory ground, white 20px cards, soft shadow. */
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --ink: #26221F; --mute: #8A827A; --faint: #B5ADA4;
    --line: #ECE6DE; --soft: #FAF8F5; --accent: #9A7B5F; --accent-soft: #F3ECE4;
    --shadow: 0 1px 2px rgba(60, 50, 40, .04), 0 10px 28px rgba(60, 50, 40, .06);
    --serif: "Source Han Serif TC", "Noto Serif TC", "Songti TC", serif;
    --sans: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; letter-spacing: .02em; line-height: 1.6; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, h4, p { margin: 0; }
  h1, h2, h3 { text-wrap: balance; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  .wrap { max-width: 880px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 28px) 16px calc(env(safe-area-inset-bottom, 0px) + 64px); display: grid; gap: 18px; }
  @media (min-width: 720px) { .wrap { padding-top: 56px; gap: 22px; } }

  /* masthead */
  .mast .eyebrow { font-size: 11px; letter-spacing: .3em; color: var(--accent); text-transform: uppercase; }
  .mast h1 { margin-top: 10px; font-family: var(--serif); font-weight: 900; font-size: 30px; line-height: 1.3; letter-spacing: .04em; }
  @media (min-width: 720px) { .mast h1 { font-size: 40px; } }
  .mast p { margin-top: 10px; color: var(--mute); font-size: 14.5px; max-width: 36em; line-height: 1.8; }

  .card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 22px 18px; }
  @media (min-width: 720px) { .card { padding: 30px 32px; } }
  .card-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card-h h2 { font-family: var(--serif); font-size: 21px; font-weight: 700; letter-spacing: .04em; }
  .card-h small { color: var(--mute); font-size: 12.5px; }
  .card-h .no { font-family: var(--serif); color: var(--accent); font-size: 13px; letter-spacing: .2em; }

  /* settings */
  .fields { margin-top: 18px; display: grid; gap: 20px; }
  .field > label, .field > p { display: flex; align-items: baseline; gap: 8px; font-size: 14px; font-weight: 700; letter-spacing: .04em; }
  .field small { font-weight: 400; color: var(--faint); font-size: 12px; letter-spacing: .06em; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { border: 1px solid var(--line); background: var(--soft); border-radius: 99px; padding: 7px 14px; font-size: 13.5px; transition: background .2s, border-color .2s, color .2s; white-space: nowrap; }
  .chip:hover { border-color: #DCD2C6; }
  .chip[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .custom { margin-top: 10px; width: 100%; border: 1px solid var(--line); background: var(--soft); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
  .custom::placeholder { color: var(--faint); }
  .custom:focus { outline: none; border-color: var(--accent); background: #fff; }
  .summary { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--mute); line-height: 1.8; }
  .summary b { color: var(--ink); font-weight: 700; }

  /* tabs */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #EAE5DE; border-radius: 16px; padding: 5px; }
  .tab { border: 0; background: transparent; border-radius: 12px; padding: 11px 8px; font-size: 14px; font-weight: 700; letter-spacing: .04em; color: var(--mute); }
  .tab[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(60, 50, 40, .08); }
  .tab small { display: block; font-weight: 400; font-size: 11px; color: var(--faint); letter-spacing: .1em; }
  [hidden] { display: none !important; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 9px 15px; font-size: 13.5px; transition: border-color .2s, background .2s; }
  .btn:hover { border-color: #DCD2C6; background: var(--soft); }
  .btn.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.dark:hover { background: #000; }
  .bar .meta { margin-left: auto; font-size: 12.5px; color: var(--mute); }

  /* day list */
  .days { margin-top: 16px; display: grid; gap: 10px; }
  .day { border: 1px solid var(--line); border-radius: 18px; background: var(--soft); overflow: hidden; }
  .day[open] { background: #fff; box-shadow: var(--shadow); border-color: transparent; }
  .day summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 14px 16px; }
  .day summary::-webkit-details-marker { display: none; }
  .day .dn { font-family: var(--serif); font-size: 13px; color: var(--accent); letter-spacing: .1em; line-height: 1.2; }
  .day .dn b { display: block; font-size: 24px; color: var(--ink); letter-spacing: 0; font-weight: 700; }
  .day .tt { min-width: 0; }
  .day .tt span { font-size: 12px; color: var(--mute); letter-spacing: .06em; }
  .day .tt p { font-size: 14.5px; font-weight: 700; line-height: 1.5; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .day .chev { width: 18px; height: 18px; color: var(--faint); transition: transform .2s; }
  .day[open] .chev { transform: rotate(180deg); }
  .day .body { padding: 0 16px 18px; display: grid; gap: 14px; }
  @media (min-width: 720px) { .day .body { padding: 0 24px 22px 86px; } }
  .seg .k { font-size: 11px; letter-spacing: .24em; color: var(--accent); }
  .seg p { margin-top: 4px; font-size: 16px; line-height: 1.95; white-space: pre-line; }
  .seg.hook p { font-family: var(--serif); font-size: 19px; font-weight: 700; line-height: 1.7; }
  .day .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--mute); }

  /* trace */
  .trace { margin-top: 16px; display: grid; gap: 12px; }
  .tr { border-radius: 18px; background: var(--soft); border: 1px solid var(--line); padding: 16px 18px; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 14px; }
  .tr .L { grid-row: span 2; font-family: var(--serif); font-size: 30px; font-weight: 900; color: var(--accent); line-height: 1; }
  .tr h4 { font-size: 14px; letter-spacing: .08em; }
  .tr h4 small { color: var(--mute); font-weight: 400; margin-left: 6px; }
  .tr p { font-size: 14.5px; line-height: 1.9; white-space: pre-line; word-break: break-word; }

  /* checklist */
  .checks { margin-top: 16px; display: grid; gap: 10px; }
  @media (min-width: 720px) { .checks { grid-template-columns: 1fr 1fr; } }
  .ck { display: flex; gap: 12px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--soft); border-radius: 16px; padding: 14px 16px; }
  .ck .box { flex: none; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #CFC5B9; margin-top: 2px; display: grid; place-items: center; color: #fff; transition: background .2s, border-color .2s; }
  .ck .box svg { width: 13px; height: 13px; opacity: 0; stroke-width: 2.4; }
  .ck[aria-checked="true"] .box { background: var(--ink); border-color: var(--ink); }
  .ck[aria-checked="true"] .box svg { opacity: 1; }
  .ck b { display: block; font-size: 14.5px; letter-spacing: .04em; }
  .ck small { display: block; font-size: 13px; color: var(--mute); margin-top: 2px; line-height: 1.7; }
  .ck[aria-checked="true"] b { text-decoration: line-through; text-decoration-color: var(--faint); }

  .foot-note { text-align: center; font-size: 12px; color: var(--faint); letter-spacing: .06em; }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translate(-50%, 10px); opacity: 0; pointer-events: none; z-index: 60; background: var(--ink); color: #fff; font-size: 13.5px; padding: 11px 18px; border-radius: 99px; transition: opacity .25s, transform .25s; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap">

  <header class="mast">
    <p class="eyebrow">30-Day Script Library · TRACE Prompt</p>
    <h1>30 天爆款腳本庫・TRACE 指令大師</h1>
    <p>點選你的角色、領域與目標，立刻產出 30 天可以直接口播的完整腳本，也能一鍵帶走一份給 ChatGPT／Claude 用的高階指令。</p>
  </header>

  <!-- 區塊一：參數設定 -->
  <section class="card" aria-labelledby="setH">
    <div class="card-h"><span class="no">01</span><h2 id="setH">參數設定</h2><small>點選或自訂，改了立刻重新生成</small></div>
    <div class="fields" id="fields"></div>
    <p class="summary" id="summary"></p>
  </section>

  <!-- 區塊二：雙頁籤 -->
  <section class="card" aria-labelledby="outH">
    <div class="card-h"><span class="no">02</span><h2 id="outH">生成結果</h2></div>
    <div class="tabs" role="tablist" style="margin-top:16px">
      <button class="tab" role="tab" id="tabDays" aria-controls="paneDays" data-tab="days">30 天腳本庫<small>SCRIPTS</small></button>
      <button class="tab" role="tab" id="tabTrace" aria-controls="paneTrace" data-tab="trace">TRACE 指令<small>PROMPT</small></button>
    </div>

    <div id="paneDays" role="tabpanel" aria-labelledby="tabDays">
      <div class="bar">
        <button class="btn dark" id="copyAll"></button>
        <button class="btn" id="toggleAll"></button>
        <span class="meta" id="daysMeta"></span>
      </div>
      <div class="days" id="days"></div>
    </div>

    <div id="paneTrace" role="tabpanel" aria-labelledby="tabTrace" hidden>
      <div class="bar">
        <button class="btn dark" id="copyTrace"></button>
        <span class="meta">貼到 ChatGPT 或 Claude 直接使用</span>
      </div>
      <div class="trace" id="trace"></div>
    </div>
  </section>

  <!-- 區塊三：微調檢查 -->
  <section class="card" aria-labelledby="ckH">
    <div class="card-h"><span class="no">03</span><h2 id="ckH">拍片前微調檢查</h2><small>逐項打勾，確認後再開拍</small></div>
    <div class="checks" id="checks"></div>
  </section>

  <p class="foot-note">純前端・不需要 API Key・你的設定只存在這台裝置的瀏覽器</p>
</div>
<div id="toast" role="status"></div>

<script>
/* =========================================================
   ICONS（線條 SVG，全站不使用 Emoji）
   ========================================================= */
const ICONS = {
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',
  check: '<path d="M5 12.5 10 17l9-10"/>',
  expand: '<path d="M4 9h16M4 15h16"/>',
};
const ico = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

/* =========================================================
   參數選項
   ========================================================= */
const OPTS = {
  role: ['行銷顧問', '自媒體講師', '健身教練', '心理諮商師', '品牌策略師'],
  domain: ['自媒體經營', '品牌打造', '理財投資', '美妝保養', '職場成長'],
  platform: ['IG Reels', 'Threads', 'YouTube Shorts', 'TikTok', '小紅書'],
  goal: ['快速漲粉', '建立專業信任', '提高產品轉換/銷售', '增加留言互動'],
  scenario: ['乾貨教學文', '避坑勸退文', '故事觀點文', '產品開箱評測', '限時優惠/導購'],
  len: ['15秒超短衝擊', '30秒黃金爆款', '45秒深度轉化'],
};
const FIELD_META = [
  { id: 'role', label: '你的角色', en: 'ROLE', custom: '或自訂角色，例如：營養師' },
  { id: 'domain', label: '內容領域', en: 'DOMAIN', custom: '或自訂領域，例如：寵物攝影' },
  { id: 'platform', label: '主要平台', en: 'PLATFORM' },
  { id: 'goal', label: '內容目標', en: 'GOAL' },
  { id: 'scenario', label: '腳本風格場景', en: 'SCENARIO' },
  { id: 'len', label: '目標影片時長', en: 'LENGTH' },
];

/* =========================================================
   領域素材庫：每個領域 6 個子題
   myth 迷思／truth 真相／trap 常見錯誤／s 三步驟／result 成果／story 過來人經歷
   ========================================================= */
const DOMAINS = {
  自媒體經營: { product: '我整理的腳本模板', pain: '想經營帳號，卻卡在沒流量、不知道拍什麼', subs: [
    { n: '帳號定位', myth: '什麼都拍，總有一支會爆', truth: '帳號要先讓平台知道你是誰，才會把你推給對的人', trap: '今天拍美食、明天拍穿搭', s: ['先寫下你最想幫助的一種人', '圍繞一個主題連續拍 30 支', '每週檢查哪一類內容數據最好'], result: '粉絲會自己找上門', story: '前半年粉絲卡在一百人' },
    { n: '開頭三秒', myth: '內容好就會有人看', truth: '觀眾滑走只要一秒，開頭決定一切', trap: '開頭先自我介紹', s: ['第一句就丟出痛點或結論', '用問句或反常識製造好奇', '前三秒畫面一定要有變化'], result: '完播率會明顯拉高', story: '花一週剪的影片，播放不到五百' },
    { n: '漲粉節奏', myth: '每天更新就會漲粉', truth: '漲粉靠的是系列內容，不是更新次數', trap: '每支影片都單打獨鬥', s: ['把內容規劃成系列', '每支結尾預告下一集', '固定時間發布'], result: '追蹤率會一支比一支高', story: '連續日更兩個月，粉絲只漲兩百' },
    { n: '腳本撰寫', myth: '靈感來了再拍就好', truth: '爆款是可以被複製的結構', trap: '想到哪拍到哪', s: ['先寫鉤子，再寫內容', '每段只講一個重點', '結尾一定給一個行動'], result: '出片速度會快三倍', story: '對著鏡頭講二十分鐘，還剪不出一支' },
    { n: '數據復盤', myth: '看播放數就夠了', truth: '真正要看的是完播率和互動率', trap: '只看播放數決定方向', s: ['每週固定看一次後台', '找出完播率最高的三支', '把它們的開頭拆出來重用'], result: '你會越來越知道觀眾要什麼', story: '一支低播放就讓我想放棄' },

    { n: '社群經營', myth: '貼文發越多越好', truth: '互動深度比發文數量重要', trap: '只發公告、不回留言', s: ['每則留言都認真回', '定期問顧客的意見', '把顧客的聲音放進內容'], result: '社群會變成你最強的業務', story: '一天發三篇，留言卻常常掛零' },
  ] },
  理財投資: { product: '我的記帳與資產配置表', pain: '想存錢投資卻怕踩雷，不知道從哪開始', subs: [

  const ex = scriptFor(1), dd = domainData(), chars = LEN_CHARS[S.len];
  return [
    { L: 'T', h: 'Task', zh: '任務', t: `請幫我產出一份《30天爆款內容排程表》，共 30 天，每天一支可以直接改寫成 ${S.platform} 貼文與短影音腳本的內容。\n每一天都要包含：天數與題材類型、黃金 3 秒開場鉤子、${S.len.replace(/秒/, ' 秒')}的完整口播文案、行動呼籲 CTA。\n題材以「${S.scenario}」為主，穿插顛覆認知、聽勸避坑、過來人故事、數字清單、內行揭秘等類型，相鄰兩天不要重複。` },
    { L: 'R', h: 'Role', zh: '角色', t: `你是一位在「${domain()}」領域擁有 10 年實戰經驗的${role()}。\n說話像過來人：口語、直接、有溫度，擅長用「千萬別……」「內行人都知道……」「我踩過無數坑才明白……」這類句型抓住注意力。` },
    { L: 'A', h: 'Audience', zh: '受眾', t: `目標受眾是對${domain()}有興趣，但${dd.pain}的人。\n他們最想要的是${GOAL_NEED[S.goal]}。內容目標：${S.goal}。` },
    { L: 'C', h: 'Constraint', zh: '限制', t: `1. 嚴禁使用「首先、此外、總結來說、綜上所述」等生硬連接詞。\n2. 每支腳本控制在 ${chars} 字左右，最多不超過 250 字。\n3. 快節奏、不說教，每句盡量不超過 20 字。\n4. 每支腳本最後用一句金句收尾。\n5. 全文不使用 Emoji。\n6. CTA 要符合 ${S.platform} 的使用習慣：${PLATFORM_CTA_HINT[S.platform]}。` },
    { L: 'E', h: 'Example', zh: '範例', t: `請融入小紅書與 IG 爆款的 Hook 結構與轉換邏輯：開頭 3 秒丟出痛點或反常識結論，中段用過來人經驗或數字清單給乾貨，結尾給明確行動。\n參考格式：\nDay 1｜${ex.type}・${ex.sub}\n開場鉤子：${ex.hook}\n口播文案：${ex.body.replace(/\n/g, '')}\n行動呼籲：${ex.cta}\n\n請用清單依序列出 Day 1 到 Day 30，方便我直接複製使用。` },
  ];
}
const traceText = () => traceParts().map(p => `【${p.L}｜${p.h} ${p.zh}】\n${p.t}`).join('\n\n');

/* =========================================================
   RENDER
   ========================================================= */
function renderFields() {
  $('#fields').innerHTML = FIELD_META.map(m => {
    const custom = m.custom ? (S[m.id + 'Custom'] || '').trim() : '';
    return `
    <div class="field">
      <p>${m.label}<small>${m.en}</small></p>
      <div class="chips" role="radiogroup" aria-label="${m.label}">${OPTS[m.id].map(o => `<button class="chip" role="radio" aria-checked="${!custom && S[m.id] === o}" data-f="${m.id}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      ${m.custom ? `<input class="custom" id="in-${m.id}" maxlength="12" placeholder="${m.custom}" value="${esc(S[m.id + 'Custom'] || '')}" />` : ''}
    </div>`;
  }).join('');
}
function renderSummary() {
  const list = allScripts(), avg = Math.round(list.reduce((a, s) => a + countChars(s.hook + s.body + s.cta), 0) / list.length);
  $('#summary').innerHTML = `目前設定：<b>${esc(role())}</b>・<b>${esc(domain())}</b>・${esc(S.platform)}・${esc(S.goal)}・${esc(S.scenario)}・${esc(S.len)}<br />已生成 30 支完整腳本，平均每支約 ${avg} 字（約 ${Math.round(avg / 4.5)} 秒）`;
  $('#daysMeta').textContent = `30 支・平均 ${avg} 字`;
}
function renderDays() {
  const list = allScripts();
  $('#days').innerHTML = list.map(s => `
    <details class="day" data-day="${s.day}" ${S.open.includes(s.day) ? 'open' : ''}>
      <summary>
        <span class="dn">DAY<b>${String(s.day).padStart(2, '0')}</b></span>
        <span class="tt"><span>${s.type}・${esc(s.sub)}</span><p>${esc(s.hook)}</p></span>
        <svg class="i chev" viewBox="0 0 24 24" aria-hidden="true">${ICONS.chev}</svg>
      </summary>
      <div class="body">
        <div class="seg hook"><span class="k">HOOK・黃金 3 秒開場</span><p>${esc(s.hook)}</p></div>
        <div class="seg"><span class="k">STORY / VALUE・核心口播</span><p>${esc(s.body)}</p></div>
        <div class="seg"><span class="k">CTA・行動呼籲</span><p>${esc(s.cta)}</p></div>
        <div class="foot"><span>約 ${countChars(s.hook + s.body + s.cta)} 字</span><button class="btn" data-copy-day="${s.day}">${ico('copy')}一鍵複製單日腳本</button></div>
      </div>
    </details>`).join('');
  $('#toggleAll').innerHTML = ico('expand') + (S.open.length >= 30 ? '全部收合' : '全部展開');
}
function renderTrace() {
  $('#trace').innerHTML = traceParts().map(p => `
    <div class="tr"><span class="L">${p.L}</span><h4>${p.h}<small>${p.zh}</small></h4><p>${esc(p.t)}</p></div>`).join('');
}
function renderTabs() {
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab));
  $('#paneDays').hidden = S.tab !== 'days';
  $('#paneTrace').hidden = S.tab !== 'trace';
}
function renderChecks() {
  $('#checks').innerHTML = CHECKS.map((c, i) => `
    <button class="ck" role="checkbox" aria-checked="${S.checks.includes(i)}" data-ck="${i}">
      <span class="box">${ico('check')}</span>
      <span><b>${i + 1}. ${c.t}</b><small>${c.d}</small></span>
    </button>`).join('');
}
function regen() { renderSummary(); renderDays(); renderTrace(); save(); }

/* =========================================================
   COPY / TOAST
   ========================================================= */
let tt;
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2000); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); return ok;
}
const copied = (ok, m) => toast(ok ? m : '複製失敗，請手動選取文字');

/* =========================================================
   EVENTS
   ========================================================= */
$('#fields').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  const f = b.dataset.f; S[f] = b.dataset.v;
  if (f === 'role' || f === 'domain') { S[f + 'Custom'] = ''; const inp = $('#in-' + f); if (inp) inp.value = ''; }
  b.parentElement.querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-checked', x === b));
  regen();
});
$('#fields').addEventListener('input', e => {
  const inp = e.target.closest('.custom'); if (!inp) return;
  const f = inp.id.replace('in-', ''); S[f + 'Custom'] = inp.value;
  inp.parentElement.querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-checked', !inp.value.trim() && S[f] === x.dataset.v));
  regen();
});
document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { S.tab = b.dataset.tab; save(); renderTabs(); }));
$('#days').addEventListener('toggle', e => {
  const d = e.target.closest('[data-day]'); if (!d) return;
  const n = +d.dataset.day;
  S.open = d.open ? [...new Set([...S.open, n])] : S.open.filter(x => x !== n); save();
  $('#toggleAll').innerHTML = ico('expand') + (S.open.length >= 30 ? '全部收合' : '全部展開');
}, true);
$('#days').addEventListener('click', async e => {
  const b = e.target.closest('[data-copy-day]'); if (!b) return;
  copied(await copy(dayText(scriptFor(+b.dataset.copyDay))), `Day ${b.dataset.copyDay} 腳本已複製`);
});
$('#toggleAll').addEventListener('click', () => { S.open = S.open.length >= 30 ? [] : Array.from({ length: 30 }, (_, k) => k + 1); save(); renderDays(); });
$('#copyAll').addEventListener('click', async () => {
  const head = `《30 天爆款短影音腳本》${role()}・${domain()}・${S.platform}・${S.goal}・${S.scenario}・${S.len}`;
  copied(await copy([head, '', ...allScripts().map(dayText)].join('\n\n')), '30 天完整腳本已複製');
});
$('#copyTrace').addEventListener('click', async () => copied(await copy(traceText()), 'TRACE 指令已複製'));
$('#checks').addEventListener('click', e => {
  const b = e.target.closest('[data-ck]'); if (!b) return;
  const i = +b.dataset.ck; S.checks = S.checks.includes(i) ? S.checks.filter(x => x !== i) : [...S.checks, i];
  b.setAttribute('aria-checked', S.checks.includes(i)); save();
});

/* =========================================================
   INIT
   ========================================================= */
$('#copyAll').innerHTML = ico('copy') + '一鍵複製 30 天完整腳本';
$('#copyTrace').innerHTML = ico('copy') + '一鍵複製 TRACE 指令';
renderFields(); renderTabs(); renderChecks(); regen();
</script>
</body>
</html>
